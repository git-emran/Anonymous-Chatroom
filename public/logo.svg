<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Private_chat logo">
  <title>Private_chat</title>
  <desc>Anonymous private chat application logo</desc>

  <!-- Outer ring / terminal frame -->
  <rect x="4" y="4" width="192" height="192" rx="18" ry="18"
        stroke="#22c55e" stroke-width="2" stroke-opacity="0.25" fill="#0a0a0a"/>

  <!-- Inner scanline texture (subtle) -->
  <rect x="4" y="4" width="192" height="192" rx="18" ry="18"
        fill="url(#scanlines)" opacity="0.07"/>

  <!-- Lock body -->
  <rect x="68" y="98" width="64" height="52" rx="6" ry="6"
        fill="#18181b" stroke="#22c55e" stroke-width="2"/>

  <!-- Lock shackle -->
  <path d="M82 98 V80 Q82 60 100 60 Q118 60 118 80 V98"
        stroke="#22c55e" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Keyhole circle -->
  <circle cx="100" cy="122" r="8" fill="#22c55e"/>
  <!-- Keyhole slot -->
  <rect x="96.5" y="122" width="7" height="12" rx="2" ry="2" fill="#22c55e"/>

  <!-- Terminal cursor blink line (decorative) — top left -->
  <rect x="20" y="26" width="14" height="3" rx="1" fill="#22c55e" opacity="0.6"/>
  <!-- Prompt ">" symbol -->
  <text x="20" y="176" font-family="monospace" font-size="11" fill="#22c55e" opacity="0.5">&gt;_</text>

  <!-- Radial glow behind lock -->
  <radialGradient id="glow" cx="50%" cy="55%" r="38%">
    <stop offset="0%" stop-color="#22c55e" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
  </radialGradient>
  <ellipse cx="100" cy="124" rx="46" ry="38" fill="url(#glow)"/>

  <!-- Scanline pattern def -->
  <defs>
    <pattern id="scanlines" x="0" y="0" width="2" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#22c55e"/>
    </pattern>
  </defs>
</svg>
